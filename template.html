<!doctype html>
<html lang="fa"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Alibaba";font-weight:400;src:url("fonts/Alibaba-Regular.ttf")}
@font-face{font-family:"Alibaba";font-weight:700;src:url("fonts/Alibaba-Bold.ttf")}
@font-face{font-family:"TCScript";src:url("fonts/Script.otf")}
:root{--bg:#EFEEEC;--accent:#E55A31;--ink:#282828;--grid:#E3E2E0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
 background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
 background-size:120px 120px;font-family:"Alibaba","Vazirmatn","Noto Sans Arabic","DejaVu Sans",sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center}
.block{width:840px;direction:rtl;text-align:right;position:relative}
.w{display:inline-block;opacity:0;will-change:transform,opacity}
.hook-text{font-weight:700;line-height:1.75;position:relative}
.big{font-weight:700;line-height:1.7}
.bar{position:absolute;height:14px;background:var(--accent);transform-origin:right center;transform:scaleX(0)}
.phrase{position:absolute;left:0;white-space:nowrap;font-family:"TCScript","Brush Script MT",cursive;font-size:210px;color:var(--accent);
 -webkit-text-stroke:4px var(--accent);transform-origin:left top;transform:rotate(13deg);line-height:1}
.h2{font-weight:700;font-size:64px;margin-bottom:34px;position:relative;display:inline-block}
.step{display:flex;direction:rtl;align-items:flex-start;gap:28px;margin-top:46px;opacity:0}
.num{font-weight:700;font-size:60px;line-height:1.5;min-width:70px}
.stxt{font-weight:700;font-size:62px;line-height:1.6}
.endwrap{display:flex;flex-direction:column;align-items:center;gap:36px;width:900px;direction:rtl}
.script{direction:ltr;font-family:"TCScript","Brush Script MT",cursive;color:var(--accent);font-size:84px;text-align:center;line-height:1.2;opacity:0}
.handle{font-weight:700;font-size:34px;opacity:0;direction:ltr}
</style></head>
<body><div id="stage"></div>
<script>
const D = __DATA__;
const stage = document.getElementById("stage");
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const norm=s=>(s||"").replace(/[^\p{L}\p{N}\u200c]/gu,"");
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const scenes=[];

function words(el,text){
  const out=[];
  text.split(/\s+/).filter(Boolean).forEach((t,i,arr)=>{
    const s=document.createElement("span");s.className="w";s.textContent=t;el.appendChild(s);
    if(i<arr.length-1) el.appendChild(document.createTextNode(" "));
    out.push(s);
  });
  return out;
}
function fit(el,maxH,sizes){
  for(const s of sizes){el.style.fontSize=s+"px";if(el.offsetHeight<=maxH)return;}
}
function mk(type){
  const sc=document.createElement("div");sc.className="scene";stage.appendChild(sc);
  const o={type,el:sc,words:[],extra:[]};scenes.push(o);return o;
}
function build(){
  D.scenes.forEach(s=>{
    const o=mk(s.type);o.start=s.start;o.end=s.end;
    if(s.type==="hook"){
      const ph=D.phrase||"";
      if(ph){
        const unit=ph+"   ";
        const mkp=(top)=>{const p=document.createElement("div");p.className="phrase";p.style.top=top+"px";p.textContent=unit.repeat(8);o.el.appendChild(p);return p;};
        o.phrases=[mkp(250),mkp(1350)];
      }
      const b=document.createElement("div");b.className="block";
      const h=document.createElement("div");h.className="hook-text";b.appendChild(h);o.el.appendChild(b);
      o.words=words(h,s.screen_text||s.narration);
      o.hook=h;fit(h,780,[112,100,92,84,76,68]);
      o.hlIndex=(()=>{const hl=norm(s.highlight);let i=o.words.findIndex(w=>norm(w.textContent)===hl);
        if(i<0&&hl)i=o.words.findIndex(w=>norm(w.textContent).includes(hl)||hl.includes(norm(w.textContent)));
        if(i<0){let m=0;o.words.forEach((w,k)=>{if(norm(w.textContent).length>norm(o.words[m].textContent).length)m=k;});i=m;}return i;})();
      const bar=document.createElement("div");bar.className="bar";h.appendChild(bar);o.bar=bar;
    }else if(s.type==="empathy"){
      const b=document.createElement("div");b.className="block";
      const t=document.createElement("div");t.className="big";b.appendChild(t);o.el.appendChild(b);
      o.words=words(t,s.screen_text||s.narration);fit(t,820,[104,96,88,80,72,64]);
      const bar=document.createElement("div");bar.className="bar";bar.style.width="260px";bar.style.right="0";bar.style.marginTop="26px";
      bar.style.position="relative";bar.style.display="block";bar.style.marginLeft="auto";b.appendChild(bar);o.bar=bar;
    }else if(s.type==="practice"){
      const b=document.createElement("div");b.className="block";
      const h2=document.createElement("div");h2.className="h2";h2.textContent="تمرین امروز";h2.style.opacity=0;b.appendChild(h2);
      const bar=document.createElement("div");bar.className="bar";h2.appendChild(bar);bar.style.right="0";bar.style.bottom="-8px";bar.style.width="100%";o.bar=bar;
      o.h2=h2;o.steps=[];
      (s.steps||[]).slice(0,3).forEach((st,i)=>{
        const r=document.createElement("div");r.className="step";
        const n=document.createElement("div");n.className="num";n.textContent=fa(i+1);
        const t=document.createElement("div");t.className="stxt";t.textContent=st;
        r.appendChild(n);r.appendChild(t);b.appendChild(r);o.steps.push(r);
      });
      o.el.appendChild(b);
    }else{
      const w=document.createElement("div");w.className="endwrap";
      const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("width","148");svg.setAttribute("height","172");svg.setAttribute("viewBox","0 0 74 86");
      svg.innerHTML='<path d="M12 0H62A12 12 0 0 1 74 12V86L37 62L0 86V12A12 12 0 0 1 12 0Z" fill="#E55A31"/>';
      svg.style.opacity=0;w.appendChild(svg);o.svg=svg;
      const t=document.createElement("div");t.className="big";t.style.textAlign="center";t.style.fontSize="84px";w.appendChild(t);
      o.words=words(t,s.screen_text||s.narration);fit(t,420,[84,76,68,60]);
      const sg=document.createElement("div");sg.className="script";sg.textContent="Maybe life will be better tomorrow.";w.appendChild(sg);o.script=sg;
      const hd=document.createElement("div");hd.className="handle";hd.textContent="@mindspark_txt";w.appendChild(hd);o.handle=hd;
      o.el.appendChild(w);
    }
  });
  // highlight bar geometry (measured once, no transforms applied yet)
  scenes.filter(s=>s.type==="hook").forEach(o=>{
    const w=o.words[o.hlIndex];if(!w)return;
    o.bar.style.left=w.offsetLeft+"px";o.bar.style.top=(w.offsetTop+w.offsetHeight*0.86)+"px";o.bar.style.width=w.offsetWidth+"px";
  });
}
function reveal(o,lt,dur,first,spread){
  const n=o.words.length||1;const step=Math.min(0.2,spread/n);
  o.words.forEach((w,k)=>{const a=ease((lt-first-k*step)/0.3);w.style.opacity=a;w.style.transform="translateY("+((1-a)*34)+"px)";});
  return first+n*step+0.3;
}
function setTime(t){
  stage.style.backgroundPosition=((t*10)%120)+"px "+((t*10)%120)+"px";
  scenes.forEach(o=>{
    const dur=o.end-o.start,lt=t-o.start;
    const live=t>=o.start&&t<o.end;
    if(!live){o.el.style.opacity=0;return;}
    const last=o.type==="loop";
    const inA=ease(lt/0.35),outA=last?1:1-ease((lt-(dur-0.22))/0.22);
    o.el.style.opacity=clamp(Math.min(inA,outA));
    o.el.style.transform="translateY("+((1-inA)*50)+"px)";
    if(o.type==="hook"){
      const doneAt=reveal(o,lt,dur,0.05,Math.min(1.1,dur*0.5));
      const w=o.words[o.hlIndex];const bs=ease((lt-doneAt+0.1)/0.4);o.bar.style.transform="scaleX("+bs+")";
      (o.phrases||[]).forEach((p,i)=>{p.style.left=(-60-lt*(i?-26:26)+(i?-40:0))+"px";p.style.opacity=ease(lt/0.4);});
    }else if(o.type==="empathy"){
      const doneAt=reveal(o,lt,dur,0.1,Math.min(1.3,dur*0.55));
      o.bar.style.transform="scaleX("+ease((lt-doneAt+0.15)/0.4)+")";
    }else if(o.type==="practice"){
      o.h2.style.opacity=ease(lt/0.3);o.bar.style.transform="scaleX("+ease((lt-0.15)/0.4)+")";
      const n=o.steps.length||1;const gap=Math.max(0.5,(dur-1.0)/(n+0.5));
      o.steps.forEach((r,i)=>{const a=ease((lt-0.7-i*gap)/0.4);r.style.opacity=a;r.style.transform="translateY("+((1-a)*40)+"px)";});
    }else{
      const a=ease((lt-0.05)/0.45);o.svg.style.opacity=a;o.svg.style.transform="scale("+(0.6+0.4*a)+")";
      const doneAt=reveal(o,lt,dur,0.35,Math.min(1.0,dur*0.4));
      o.script.style.opacity=ease((lt-doneAt)/0.4);o.handle.style.opacity=ease((lt-doneAt-0.2)/0.4);
    }
  });
}
function init(){build();setTime(0);return true;}
</script></body></html>
