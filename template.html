<!doctype html>
<html lang="fa"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Alibaba";font-weight:400;src:url("fonts/Alibaba-Regular.ttf")}
@font-face{font-family:"Alibaba";font-weight:700;src:url("fonts/Alibaba-Bold.ttf")}
@font-face{font-family:"TCScript";src:url("fonts/Script.otf")}
:root{--bg:#EFEEEC;--accent:#E55A31;--ink:#282828;--grid:#E3E2E0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
 background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
 background-size:120px 120px;font-family:"Alibaba","Vazirmatn","Noto Sans Arabic","DejaVu Sans",sans-serif;color:var(--ink)}
.latin{font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans","DejaVu Sans",sans-serif;direction:ltr}
#top{position:absolute;left:120px;top:96px;width:840px;display:flex;justify-content:space-between;align-items:flex-end;
 font-size:30px;font-weight:700;letter-spacing:.06em;height:44px}
#toprule{position:absolute;left:120px;top:150px;width:840px;height:6px;background:var(--ink)}
#botrule{position:absolute;left:120px;top:1750px;width:840px;height:2px;background:var(--ink)}
#segs{position:absolute;left:120px;top:1780px;width:840px;height:8px;display:flex;gap:16px;direction:ltr}
.seg{flex:1;background:rgba(40,40,40,.14);position:relative}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
#tagline{position:absolute;left:120px;top:1824px;width:840px;font-size:28px;font-weight:700;letter-spacing:.06em;color:var(--accent);opacity:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.zone{position:absolute;left:120px;width:840px;direction:rtl;text-align:right}
.w{display:inline-block;opacity:0;will-change:transform,opacity}
.hook-text{font-weight:700;line-height:1.6;position:relative}
.big{font-weight:700;line-height:1.65}
.bar{position:absolute;height:12px;background:var(--accent);transform-origin:right center;transform:scaleX(0)}
.phrase{position:absolute;left:120px;top:230px;width:840px;font-weight:700;font-size:168px;line-height:.96;letter-spacing:-.045em;color:var(--accent);opacity:0}
.tag{display:flex;align-items:center;gap:22px;font-weight:700;font-size:40px;margin-bottom:46px;opacity:0}
.tag b{display:block;width:96px;height:6px;background:var(--ink)}
.step{display:flex;direction:rtl;align-items:flex-start;gap:30px;padding:30px 0;border-top:2px solid var(--ink);opacity:0}
.num{font-weight:700;font-size:56px;line-height:1.5;min-width:84px}
.stxt{font-weight:700;font-size:60px;line-height:1.6}
.endwrap{display:flex;flex-direction:column;align-items:flex-end;gap:40px}
.script{direction:ltr;align-self:flex-start;font-family:"TCScript","Brush Script MT",cursive;color:var(--accent);font-size:64px;line-height:1.2;opacity:0}
</style></head>
<body><div id="stage">
<div id="top" class="latin"><span>@mindspark_txt</span><span id="idx">01 / 04</span></div>
<div id="toprule"></div><div id="botrule"></div><div id="segs"></div>
<div id="tagline" class="latin"></div>
</div>
<script>
const D = __DATA__;
const stage = document.getElementById("stage");
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const norm=s=>(s||"").replace(/[^\p{L}\p{N}\u200c]/gu,"");
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const LABELS={empathy:"نتیجه",situation:"موقعیت",practice:"تمرین امروز"};
const scenes=[];let segEls=[];

function words(el,text){
  const out=[];
  text.split(/\s+/).filter(Boolean).forEach((t,i,arr)=>{
    const s=document.createElement("span");s.className="w";s.textContent=t;el.appendChild(s);
    if(i<arr.length-1) el.appendChild(document.createTextNode(" "));
    out.push(s);
  });
  return out;
}
function fit(el,maxH,sizes){
  for(const s of sizes){el.style.fontSize=s+"px";if(el.offsetHeight<=maxH)return;}
}
function mk(type){
  const sc=document.createElement("div");sc.className="scene";stage.appendChild(sc);
  const o={type,el:sc,words:[]};scenes.push(o);return o;
}
function zone(o,top){
  const z=document.createElement("div");z.className="zone";z.style.top=top+"px";o.el.appendChild(z);return z;
}
function tag(o,z,text){
  const t=document.createElement("div");t.className="tag";
  const b=document.createElement("b");t.appendChild(b);
  const s=document.createElement("span");s.textContent=text;t.appendChild(s);
  z.appendChild(t);o.tag=t;
}
function build(){
  const tg=document.getElementById("tagline");tg.textContent=D.phrase||"";
  const segs=document.getElementById("segs");
  D.scenes.forEach(()=>{const s=document.createElement("div");s.className="seg";s.appendChild(document.createElement("i"));segs.appendChild(s);segEls.push(s.firstChild);});
  D.scenes.forEach(s=>{
    const o=mk(s.type);o.start=s.start;o.end=s.end;
    if(s.type==="hook"){
      const ph=D.phrase||"";
      if(ph){const p=document.createElement("div");p.className="phrase latin";
        p.innerHTML=ph.split(/\s+/).join("<br>");o.el.appendChild(p);o.phrase=p;}
      const z=zone(o,930);const h=document.createElement("div");h.className="hook-text";z.appendChild(h);
      o.words=words(h,s.screen_text||s.narration);fit(h,700,[116,104,96,88,80,72]);
      o.hlIndex=(()=>{const hl=norm(s.highlight);let i=o.words.findIndex(w=>norm(w.textContent)===hl);
        if(i<0&&hl)i=o.words.findIndex(w=>norm(w.textContent).includes(hl)||hl.includes(norm(w.textContent)));
        if(i<0){let m=0;o.words.forEach((w,k)=>{if(norm(w.textContent).length>norm(o.words[m].textContent).length)m=k;});i=m;}return i;})();
      const bar=document.createElement("div");bar.className="bar";h.appendChild(bar);o.bar=bar;o.hook=h;
    }else if(s.type==="practice"){
      const z=zone(o,560);tag(o,z,s.label||LABELS.practice);o.steps=[];
      (s.steps||[]).slice(0,3).forEach((st,i)=>{
        const r=document.createElement("div");r.className="step";
        const n=document.createElement("div");n.className="num";n.textContent=fa(i+1);
        const t=document.createElement("div");t.className="stxt";t.textContent=st;
        r.appendChild(n);r.appendChild(t);z.appendChild(r);o.steps.push(r);
      });
    }else if(s.type==="loop"){
      const z=zone(o,520);const w=document.createElement("div");w.className="endwrap";z.appendChild(w);
      const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("width","120");svg.setAttribute("height","140");svg.setAttribute("viewBox","0 0 74 86");
      svg.innerHTML='<path d="M12 0H62A12 12 0 0 1 74 12V86L37 62L0 86V12A12 12 0 0 1 12 0Z" fill="#E55A31"/>';
      svg.style.opacity=0;w.appendChild(svg);o.svg=svg;
      const t=document.createElement("div");t.className="big";t.style.width="100%";w.appendChild(t);
      o.words=words(t,s.screen_text||s.narration);fit(t,520,[100,92,84,76,68]);
      const sg=document.createElement("div");sg.className="script";sg.textContent="Maybe life will be better tomorrow.";w.appendChild(sg);o.script=sg;
    }else if(s.type==="outro"){
      // extra final slide, outside the 4 main slides: no bookmark, just the goodbye line
      const z=zone(o,800);
      const t=document.createElement("div");t.className="big";t.style.textAlign="center";z.appendChild(t);
      o.words=words(t,s.screen_text||s.narration);fit(t,300,[136,124,112,100,88]);
      const bar=document.createElement("div");bar.className="bar";bar.style.width="220px";
      bar.style.position="relative";bar.style.display="block";bar.style.margin="30px auto 0";
      z.appendChild(bar);o.bar=bar;
    }else{
      const z=zone(o,s.type==="situation"?560:600);tag(o,z,s.label||LABELS[s.type]||LABELS.empathy);
      const t=document.createElement("div");t.className="big";z.appendChild(t);
      o.words=words(t,s.screen_text||s.narration);fit(t,760,[100,92,84,76,68,60]);
      const bar=document.createElement("div");bar.className="bar";bar.style.width="220px";bar.style.right="0";
      bar.style.position="relative";bar.style.display="block";bar.style.marginLeft="auto";bar.style.marginTop="30px";
      z.appendChild(bar);o.bar=bar;
    }
  });
  scenes.filter(s=>s.type==="hook").forEach(o=>{
    const w=o.words[o.hlIndex];if(!w)return;
    o.bar.style.left=w.offsetLeft+"px";o.bar.style.top=(w.offsetTop+w.offsetHeight*0.9)+"px";o.bar.style.width=w.offsetWidth+"px";
  });
}
function reveal(o,lt,first,spread){
  const n=o.words.length||1;const step=Math.min(0.22,spread/n);
  o.words.forEach((w,k)=>{const a=ease((lt-first-k*step)/0.35);w.style.opacity=a;w.style.transform="translateY("+((1-a)*22)+"px)";});
  return first+n*step+0.35;
}
function setTime(t){
  const tg=document.getElementById("tagline");let cur=-1;
  const lastI=scenes.length-1;
  scenes.forEach((o,i)=>{
    const dur=o.end-o.start,lt=t-o.start;
    const live=t>=o.start&&t<o.end;
    segEls[i].style.width=(t>=o.end?100:live?clamp(lt/dur)*100:0)+"%";
    if(!live){o.el.style.opacity=0;return;}
    cur=i;
    const last=(i===lastI);
    const inA=ease(lt/0.4),outA=last?1:1-ease((lt-(dur-0.2))/0.2);
    o.el.style.opacity=clamp(Math.min(inA,outA));
    if(o.tag)o.tag.style.opacity=ease((lt-0.05)/0.35);
    if(o.type==="hook"){
      if(o.phrase)o.phrase.style.opacity=ease(lt/0.5);
      const doneAt=reveal(o,lt,0.35,Math.min(1.2,dur*0.5));
      o.bar.style.transform="scaleX("+ease((lt-doneAt+0.1)/0.5)+")";
    }else if(o.type==="practice"){
      const n=o.steps.length||1;const gap=Math.max(0.6,(dur-1.2)/(n+0.5));
      o.steps.forEach((r,i)=>{const a=ease((lt-0.6-i*gap)/0.45);r.style.opacity=a;r.style.transform="translateY("+((1-a)*26)+"px)";});
    }else if(o.type==="loop"){
      const a=ease((lt-0.05)/0.5);o.svg.style.opacity=a;o.svg.style.transform="translateY("+((1-a)*20)+"px)";
      const doneAt=reveal(o,lt,0.4,Math.min(1.0,dur*0.4));
      o.script.style.opacity=ease((lt-doneAt)/0.5);
    }else{
      const doneAt=reveal(o,lt,0.4,Math.min(1.4,dur*0.55));
      o.bar.style.transform="scaleX("+ease((lt-doneAt+0.1)/0.5)+")";
    }
  });
  const nm=scenes.filter(s=>s.type!=="outro").length;
  document.getElementById("idx").textContent=(cur<0?"":(cur>=nm?"":("0"+(cur+1)+" / 0"+nm)));
  const ct=cur<0?"":scenes[cur].type;
  tg.style.opacity=(cur>0&&ct!=="loop"&&ct!=="outro")?1:0;
}
function init(){build();setTime(0);return true;}
</script></body></html>
